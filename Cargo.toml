[package]
name = "dune"
version = "0.1.0"
edition = "2024"
description = "Dune Terminal Codex — A Codex of Arrakis in your terminal"
license = "MIT"
repository = "https://github.com/na7hk3r/dune-terminal-codex"

[[bin]]
name = "dune"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
ureq = { version = "3", features = ["json"] }
shellexpand = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
